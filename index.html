<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unified Admin Portal: ES migration demo</title>
<style>
html,body{height:100%;margin:0}body{display:flex;flex-direction:column;font-family:Inter,system-ui,sans-serif;background:#f7f6f4;color:#23201f}
header{background:#fff;border-bottom:1px solid #e5e1dc;padding:10px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}.dot{width:22px;height:22px;border-radius:6px;background:#7c52ff;display:inline-block}
nav{display:flex;gap:6px}nav a{padding:8px 14px;border-radius:8px;text-decoration:none;color:#4a4540;font-weight:600;font-size:14px}nav a.on{background:#ebe6ff;color:#4b2fc7}nav a:hover:not(.on){background:#efece8}
#desc{color:#6b6560;font-size:13px;margin-left:auto}iframe{flex:1;border:0;width:100%;background:#f7f6f4}
</style></head><body>
<header><div class="brand"><span class="dot"></span>Unified Admin Portal &middot; ES migration demo</div><nav><a href="#user" data-k="user">Admin user page (delta)</a><a href="#call" data-k="call">ES call page: basic</a><a href="#full" data-k="full">ES call page: full sample</a></nav><div id="desc"></div></header>
<iframe id="f" title="Demo page"></iframe>
<script>
const T={"user":["user-settings.html","New and changed items on the admin user page, highlighted in green. Click the green buttons to see the flows."],"call":["call-basic.html","Replica of the ES call page in Dialtone, for call 4709223703117824."],"full":["call-full.html","Same page with every section and optional element filled, plus implementation notes at the bottom."]};
function go(k){if(!T[k])k='user';document.getElementById('f').src=T[k][0];document.getElementById('desc').textContent=T[k][1];
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k))}
document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();history.replaceState(null,'','#'+a.dataset.k);go(a.dataset.k)}));
go(location.hash.slice(1));
</script></body></html>
